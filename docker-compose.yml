services:
  backend:
    build: ./backend
    restart: always
    env_file:
      - .env
    volumes:
      - storage_data:/var/www/html/storage
      - public_data:/var/www/html/public
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - petmatch-network

  nginx:
    image: nginx:alpine
    restart: always
    # ❌ REMOVE THIS:
    # ports:
    #   - "8000:80"
    expose:
      - "80"  # ✅ Use expose instead
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
      - public_data:/var/www/html/public:ro
      - storage_data:/var/www/html/storage:ro
    depends_on:
      - backend
    networks:
      - petmatch-network

  mysql:
    image: mysql:8.0
    restart: always
    env_file: .env
    volumes:
      - mysql_data:/var/lib/mysql
    # ❌ REMOVE THIS:
    # ports:
    #   - "3307:3306"
    # No expose needed - only backend accesses it internally
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 5s
    networks:
      - petmatch-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    expose:
      - "3000"  # ✅ Add this
    depends_on:
      - nginx
    restart: always
    networks:
      - petmatch-network

volumes:
  mysql_data:
  storage_data:
  public_data:

networks:
  petmatch-network:
    driver: bridge